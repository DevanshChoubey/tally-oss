# Godavari Drip & Pump Works: the sample company's seed (version 1).
#
# Everything here is fictional. The masters, the history and the vouchers are posted through
# the same API the app uses (crates/ledgerly-sample/src/load.rs); no total is stored here, every
# figure on screen comes from the engine. Money is rupees as text; dates are YYYY-MM-DD.
#
# Sections: [company] and [[unit]], [[ledger]], [[item]] are the masters; [[voucher]] entries with
# section = "history" are INVENTED to reach the mock's balances on 1 Nov 2026 (design/mock-v2/index.html
# lines 517-549, the `ob` column); section = "november" are the mock's own vouchers (lines 566-581).
# Opening balances are those of 1 Apr 2026, derived by hand in design/PARITY-GAPS.md ("Sample company").
# GSTINs use the fake PAN pattern ZZZZZ####Z with a computed check character; they differ from the
# mock's on purpose (privacy). Bank accounts and IFSC codes are obviously fake.

