# Hindi UI strings (हिन्दी).
#
# Sources read for accounting and GST terms (2026-11-24):
#   * https://help.tallysolutions.com/docs/te9rel49/07_MULTI-LINGUAL_FEATURES/Multilingual_Capabilities_in_TallyERP.htm
#     (read 2026-11-24): confirms that Hindi is a UI language of the accounting product. It gives no
#     term translations, so no term below is taken from it.
#   * https://abcaus.in/gst/cbic-lexicon-gst-hindi-words-phrases.html/amp (read 2026-11-24): says a
#     CBIC Hindi GST lexicon exists. The lexicon itself could not be read.
#   * https://shabdavali.rbi.org.in (read 2026-11-24): the RBI banking glossary. It returned a
#     human-verification challenge, so no term was read from it.
#   * https://www.rbi.org.in (read 2026-11-24): links to that glossary; no Hindi term on it.
#   * https://cbic-gst.gov.in (read 2026-11-24): its Hindi control has no Hindi URL and no Hindi GST
#     term page. https://www.gst.gov.in/faq (read 2026-11-24): HTTP 404 on the fetched URL.
#   * https://cstt.education.gov.in and https://cstt.gov.in (tried 2026-11-24): connection refused
#     and no DNS entry. No CSTT glossary was read.
#   * https://hisab-kitab.pages.dev/en/glossary/terms (read 2026-11-24): a third-party accounting
#     and GST glossary (IndusForward). It is not an official source and does not settle any term
#     here, so its equivalents (for example ledger = खाता बही, trial balance = तलपट) are not used.
# No official source settled any term, so every term below is marked `# unsourced`.
# Digits, dates and amounts are not in this file: they come from the formatters, Latin digits in
# Indian grouping (12,34,567.00) in both languages.

