# Ledgerly keymap: the classic preset (spec section 7, "Classic keys preset on by default").
#
# Format: `preset` names the keymap; `[bindings]` maps an action id to a list of key chords.
# A chord is zero or more of Ctrl, Alt, Shift joined with `+`, then one key name
# (F4, A, 2, Enter, Escape, ...). Ctrl is Cmd on macOS. An action with an empty list is unbound.
# A chord may be bound to one action only; `from_toml` rejects a file that breaks this.
#
# Sources for the defaults: spec section 7 (voucher keys F4-F9, F2, F3, F11, F12, Ctrl+A, Esc,
# Alt+C, Ctrl+Enter, Alt+D, Alt+X, Alt+2, Alt+F1, Ctrl+P/E/M, and the modern aliases Ctrl+S,
# Ctrl+K, Ctrl+Z) and docs/research/02-ux-keyboard.md section 3 for the rest (F1, Alt+I, Ctrl+I,
# Ctrl+D, Alt+G, Ctrl+G). Ctrl+T and Ctrl+W are the tab keys U1 already handles.
# Switch Dr/Cr is unbound. Read 2026-11-21: Tally's shortcut page gives Alt+S to Stock Query and
# lists no side-switch key; the contra page sets a line's side by the Dr or Cr field it is entered
# in. The binding is pending. The voucher screen's Dr / Cr button does the switch.

preset = "classic"

[bindings]
# Create a voucher of each kind.
new-contra = ["F4"]
new-payment = ["F5"]
new-receipt = ["F6"]
new-journal = ["F7"]
new-sales = ["F8"]
new-purchase = ["F9"]

# Context and screens.
change-period = ["F2"]
switch-company = ["F3"]
company-features = ["F11"]
configure = ["F12"]
help = ["F1"]
back = ["Escape"]
open-palette = ["Ctrl+K", "Alt+G"]
switch-palette = ["Ctrl+G"]
new-tab = ["Ctrl+T"]
close-tab = ["Ctrl+W"]

# Forms and vouchers.
save = ["Ctrl+A", "Ctrl+S"]
create-master = ["Alt+C"]
alter-master = ["Ctrl+Enter"]
more-details = ["Ctrl+I"]
delete-line = ["Ctrl+D"]
switch-side = []
delete-voucher = ["Alt+D"]
cancel-voucher = ["Alt+X"]
duplicate-voucher = ["Alt+2"]
insert-voucher = ["Alt+I"]
undo = ["Ctrl+Z"]

# Reports and output.
toggle-detail = ["Alt+F1"]
print = ["Ctrl+P"]
export = ["Ctrl+E"]
email = ["Ctrl+M"]
