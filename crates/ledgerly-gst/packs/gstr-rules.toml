# GSTR-1 and input-credit rules (Wave 3 card C2). Not a `rates-*` file: those are read by the G2
# tests, which demand a notification number on every verified entry. Read at 2026-11-21.
# The slab pack stays separate; `RulePack::merge` joins them.
version = "2026.1-gstr-rules"

# Rule 59(4) of the CGST Rules, 2017 as amended by Notification No. 12/2024-Central Tax dated
# 10 July 2024: "two and a half lakh rupees" becomes "one lakh rupees" with effect from
# 1 August 2024; table 5 (B2CL) is "inter-State supplies with invoice value more than one lakh
# rupees made to the unregistered persons". Read in the notification PDF
# <https://www.gstcouncil.gov.in/sites/default/files/2024-09/central-tax-12-2024-11072024.pdf>
# and the GSTR-1 user guide <https://tutorial.gst.gov.in/userguide/returns/Creation_of_Outward_Supplies_Return_in_GSTR-1.htm>
# (Table 5A, 5B: "more than Rs. 1 lakh"; Rs 2.5 lakh up to the July 2024 tax period), both on 2026-11-21.
# No entry before 2024-08-01: the start date of the Rs 2.5 lakh rule was not read.
[[entry]]
id = "gstr1.b2cl_threshold"
effective_from = "2024-08-01"
legal_ref = "Rule 59(4) of the CGST Rules, 2017 as amended by Notification No. 12/2024-Central Tax dated 10 July 2024, in force from 1 August 2024"
[entry.params]
invoice_value_rupees = "100000"

# Table 12 and credit notes. The GSTR-1 user guide (read 2026-11-21) says the Table 12 B2B figures
# must match the totals of Tables 4, 6B, 6C, 8, 9A, 9B, 9C and 15, which include credit and debit
# notes, but it never says that notes reduce the HSN rows (net) or stay out of them (exclude).
# The TallyPrime HSN/SAC summary page
# <https://help.tallysolutions.com/tally-prime/gstr-1/hsn-sac-summary/> is silent on notes too.
[[entry]]
id = "gstr1.hsn_credit_notes"
effective_from = "2024-08-01"
pending = true
[entry.params]
source_note = "tutorial.gst.gov.in GSTR-1 user guide and help.tallysolutions.com HSN/SAC summary page read 2026-11-21: neither states whether credit notes reduce the Table 12 rows (net) or are left out (exclude)"

# CGST Act s.17(5), text read in the CBIC copy of the Act <https://cbic-gst.gov.in/pdf/CGST-Act-Updated-31082021.pdf>
# on 2026-11-25 (extracted with pdftotext): (a) "motor vehicles for transportation of persons having
# approved seating capacity of not more than thirteen persons (including the driver), except when
# they are used for ... further supply of such motor vehicles; or transportation of passengers; or
# imparting training on driving such motor vehicles"; (aa) vessels and aircraft with their own
# exceptions; (ab) general insurance, servicing, repair and maintenance of those; (b)(i) "food and
# beverages, outdoor catering, beauty treatment, health services, cosmetic and plastic surgery,
# leasing, renting or hiring of motor vehicles, vessels or aircraft ... life insurance and health
# insurance", with a proviso for use in an outward supply of the same category; (b)(ii) "membership
# of a club, health and fitness centre".
#
# The section names no HSN or SAC code and its exceptions depend on use, which the books do not
# record. So `hsn_prefixes` is a deliberately WIDE list of the tariff headings under which those
# goods and services are classified: a line under one of them is never claimed silently, the engine
# returns Unsupported and asks the user to mark the item or ledger eligible or ineligible; a line
# under no listed heading is Eligible. A wide list can only cost the user a click; a narrow one could
# let blocked credit through. The headings are read in the GST Council's consolidated rate
# schedules, both on 2026-11-25:
#   goods: <https://www.gstcouncil.gov.in/sites/default/files/2024-02/gstgoodsrates.pdf>: heading
#     8702 (buses, motor vehicles for ten or more persons including the driver), 8703 (motor cars and
#     other motor vehicles principally designed for the transport of persons), 8801 (balloons) and
#     8802 (aircraft), 8901 (cruise ships and other vessels) with 8902 to 8906 (Chapter 89 vessels).
#   services: <https://www.gstcouncil.gov.in/sites/default/files/2024-02/gstservicerates.pdf>: heading
#     9963 (accommodation, food and beverage services, outdoor catering), 9993 (human health
#     services), 9995 (membership of organisations), 9996 (recreational services), 9997 (other
#     services: beauty and physical well-being), 9966 (renting of motor vehicles and other transport
#     equipment), 9971 (financial and insurance services, including life and health insurance).
# Items outside any of these headings (for example pumps, pipes and ordinary goods) are Eligible.
# Not read: the Customs Tariff itself; a motor vehicle under a heading not listed here (for example
# a heading added later) would not be caught, so the list is reviewed with each tariff change.
[[entry]]
id = "itc.blocked.motor_vehicles"
effective_from = "2017-07-01"
legal_ref = "CGST Act s.17(5)(a) and (ab)"
[entry.params]
section = "17(5)(a)"
hsn_prefixes = "8702,8703"

[[entry]]
id = "itc.blocked.vessels_aircraft"
effective_from = "2017-07-01"
legal_ref = "CGST Act s.17(5)(aa) and (ab)"
[entry.params]
section = "17(5)(aa)"
hsn_prefixes = "8801,8802,8901,8902,8903,8904,8905,8906"

[[entry]]
id = "itc.blocked.food_beverages"
effective_from = "2017-07-01"
legal_ref = "CGST Act s.17(5)(b)"
[entry.params]
section = "17(5)(b)"
hsn_prefixes = "9963,9993,9995,9996,9997,9966,9971"
