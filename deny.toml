# cargo-deny configuration (rule B7)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "BSL-1.0",
  # Fonts bundled by egui (epaint_default_fonts).
  "OFL-1.1", "Ubuntu-font-1.0",
  # Mozilla's root certificate list (webpki-roots), used by rustls.
  "CDLA-Permissive-2.0",
]

# AGPL-3.0-or-later is NOT in the allow list above, so a third-party dependency under the AGPL
# fails the check. It is allowed only for our own workspace crates, named one by one. A new
# AGPL workspace crate must be added here on purpose (and MIT/Apache crates need nothing).
exceptions = [
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-api" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-app" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-assist" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-bank" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-cli" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-conformance" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-engine" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-gst" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-mcp" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-model" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-print" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-reports" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-sample" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-stock" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-store" },
  { allow = ["AGPL-3.0-or-later"], crate = "ledgerly-tally-bridge" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
