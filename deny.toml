# cargo-deny configuration (rule B7)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "BSL-1.0",
  # Our own app crates.
  "AGPL-3.0-or-later",
  # Fonts bundled by egui (epaint_default_fonts).
  "OFL-1.1", "Ubuntu-font-1.0",
  # Mozilla's root certificate list (webpki-roots), used by rustls.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
