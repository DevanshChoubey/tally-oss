<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerly mock v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Ledgerly mock v2. Tokens first. Every colour in the UI is a token.
   Contrast ratios for each pair are listed in DESIGN.md.
   ===================================================================== */
:root{
  /* motion tokens (also in transitions.json). Easings equal emath::easing cubic_* */
  --dur-instant:0ms; --dur-fast:120ms; --dur-base:180ms; --dur-slow:240ms; --dur-emph:600ms;
  --ease-out:cubic-bezier(.33,1,.68,1); --ease-in:cubic-bezier(.32,0,.67,0); --ease-in-out:cubic-bezier(.65,0,.35,1);
  /* spacing (4 pt grid) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  /* radii */
  --r-xs:4px; --r-s:6px; --r-m:10px; --r-l:14px;
  /* type scale */
  --t-cap:11px; --t-meta:12px; --t-body:13px; --t-input:14px; --t-h3:14px; --t-h2:16px; --t-h1:20px; --t-fig:26px;
  --bw:1px;
  font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--t-body); line-height:1.45; font-feature-settings:"tnum" 1,"cv11" 1;
}
:root[data-theme="light"]{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#FBFAF8; --sunken:#EFEDE8; --hover:#F1EFEA;
  --border:#E2DFD8; --border-strong:#8F897E;
  --text:#1C1B19; --text-2:#4A4741; --text-3:#615D55;
  --accent:#6B2D73; --on-accent:#FFFFFF; --accent-soft:#F3E8F4; --accent-ink:#5A2161;
  --ai:#9A4211; --ai-soft:#FBEDE3; --ai-ink:#86390D;
  --ok:#1E6E3F; --ok-soft:#E3F2E8; --warn:#7E4C00; --warn-soft:#FBF0DC; --bad:#B3261E; --bad-soft:#FCE9E7;
  --scrim:rgba(28,27,25,.38); --shadow-1:0 1px 2px rgba(28,27,25,.06); --shadow-2:0 12px 32px -12px rgba(28,27,25,.30);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1C1B19; --surface-2:#23221F; --sunken:#0F0E0D; --hover:#2A2825;
  --border:#34322E; --border-strong:#77726A;
  --text:#EEEBE5; --text-2:#C9C4BA; --text-3:#A8A296;
  --accent:#D9A6E0; --on-accent:#2A0F2E; --accent-soft:#3A2340; --accent-ink:#EBCBEF;
  --ai:#F2A36E; --ai-soft:#3D2414; --ai-ink:#F7BE97;
  --ok:#7FCF9A; --ok-soft:#173323; --warn:#E9B860; --warn-soft:#3A2A10; --bad:#F28B82; --bad-soft:#3E1C1A;
  --scrim:rgba(0,0,0,.55); --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --surface-2:#000000; --sunken:#000000; --hover:#1A1A1A;
  --border:#FFFFFF; --border-strong:#FFFFFF;
  --text:#FFFFFF; --text-2:#FFFFFF; --text-3:#E6E6E6;
  --accent:#F5B8FF; --on-accent:#000000; --accent-soft:#2B0A30; --accent-ink:#F5B8FF;
  --ai:#FFB37A; --ai-soft:#2E1606; --ai-ink:#FFC79E;
  --ok:#8CF5A9; --ok-soft:#062612; --warn:#FFD27A; --warn-soft:#2E2000; --bad:#FF9C94; --bad-soft:#330B08;
  --scrim:rgba(0,0,0,.8); --shadow-1:none; --shadow-2:none; --bw:2px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{background:var(--surface);border:var(--bw) solid var(--border-strong);border-radius:var(--r-s);height:32px;padding:0 10px;font-size:var(--t-input);min-width:0}
textarea{height:auto;padding:8px 10px;resize:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:var(--t-h1);font-weight:650;letter-spacing:-.015em}
h2{font-size:var(--t-h2);font-weight:600;letter-spacing:-.01em}
h3{font-size:var(--t-h3);font-weight:600}
.num,td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)} .t2{color:var(--text-2)} .meta{font-size:var(--t-meta);color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:600 var(--t-cap)/16px Inter,system-ui,sans-serif;min-width:18px;display:inline-block;text-align:center;padding:0 5px;border-radius:var(--r-xs);
  border:var(--bw) solid var(--border);border-bottom-width:2px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.l{width:20px;height:20px}

/* ---------- shell ---------- */
.app{display:grid;height:100vh;grid-template-columns:var(--navw,208px) 1fr;grid-template-rows:48px 1fr 32px;
  grid-template-areas:"top top" "nav main" "keys keys"}
.app.rail{--navw:60px}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:var(--bw) solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em;padding-right:6px;color:var(--text)}
.brand svg{width:24px;height:24px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:var(--bw) solid var(--border);border-radius:var(--r-s);background:var(--surface);white-space:nowrap;color:var(--text-2);font-size:var(--t-meta)}
.chip b{color:var(--text);font-weight:600}
button.chip:hover{background:var(--hover)}
.chip.lock{color:var(--text-2)}
.search{flex:1;max-width:420px;margin:0 auto;justify-content:space-between;height:32px;font-size:var(--t-body);color:var(--text-3)}
.search span{display:inline-flex;gap:8px;align-items:center}
.aichip[data-tier="local"]{color:var(--ok);border-color:var(--ok)}
.aichip[data-tier="cloud"]{color:var(--ai);border-color:var(--ai)}
.aichip[data-tier="off"]{color:var(--text-3)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--text-2)}
.iconbtn:hover{background:var(--hover);color:var(--text)}

nav.side{grid-area:nav;background:var(--surface);border-right:var(--bw) solid var(--border);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:1px}
nav.side .grp{color:var(--text-3);font-size:var(--t-cap);font-weight:600;padding:12px 10px 4px;text-transform:none;letter-spacing:.02em}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r-s);color:var(--text-2)}
nav.side button .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side button:hover{background:var(--hover);color:var(--text)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav.side button kbd{background:transparent}
nav.side .count{font-size:var(--t-cap);font-weight:700;background:var(--ai-soft);color:var(--ai-ink);border-radius:9px;padding:0 6px;line-height:18px}
.app.rail nav.side .lbl,.app.rail nav.side kbd,.app.rail nav.side .grp,.app.rail nav.side .count{display:none}
.app.rail nav.side button{justify-content:center;padding:0}
nav.side .foot{margin-top:auto;padding:8px 10px;color:var(--text-3);font-size:var(--t-cap)}

main{grid-area:main;overflow:auto;min-width:0;position:relative}
#stage{padding:18px 24px 40px;max-width:1320px}
.keys{grid-area:keys;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--surface);border-top:var(--bw) solid var(--border);color:var(--text-2);font-size:var(--t-meta);overflow:hidden;white-space:nowrap}
.keys span{display:inline-flex;gap:5px;align-items:center}
.keys .ctx{color:var(--text);font-weight:600}
.keys .mod{color:var(--accent-ink);font-weight:600}
.keys .right{margin-left:auto;color:var(--text-3)}

/* ---------- page parts ---------- */
.crumbs{display:flex;gap:6px;align-items:center;color:var(--text-3);font-size:var(--t-meta);margin-bottom:6px}
.crumbs button{color:var(--text-2)} .crumbs button:hover{color:var(--accent);text-decoration:underline}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.phead p{color:var(--text-2);margin-top:3px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-s);border:var(--bw) solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:1;background:var(--sunken);border-color:var(--border);color:var(--text-3);cursor:not-allowed}
.btn kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.85}
.card{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow-1)}
.card.pad{padding:14px 16px}
.card h2{margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr)}
.tabs{display:flex;gap:2px;border-bottom:var(--bw) solid var(--border);margin-bottom:14px}
.tabs button{padding:8px 12px;border-bottom:2px solid transparent;color:var(--text-2);display:inline-flex;gap:8px;align-items:center;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-cap);font-weight:600;line-height:18px;padding:0 7px;border-radius:var(--r-xs);white-space:nowrap;border:var(--bw) solid transparent}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-ai{background:var(--ai-soft);color:var(--ai-ink)} .b-acc{background:var(--accent-soft);color:var(--accent-ink)} .b-n{background:var(--sunken);color:var(--text-2)}
:root[data-theme="hc"] .badge{border-color:currentColor}
.badge .ico{width:12px;height:12px}

table.t{width:100%;border-collapse:collapse}
table.t th{font-size:var(--t-meta);font-weight:600;color:var(--text-3);text-align:left;padding:6px 10px;border-bottom:var(--bw) solid var(--border);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:var(--bw) solid var(--border);vertical-align:middle}
table.t tr.sel td{background:var(--accent-soft)}
table.t tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.t tbody tr[data-row]{cursor:pointer}
table.t tbody tr[data-row]:hover td{background:var(--hover)}
table.t tbody tr.sel[data-row]:hover td{background:var(--accent-soft)}
table.t tr.total td{font-weight:650;border-top:var(--bw) solid var(--text-2);border-bottom:3px double var(--text-2)}
table.t tr.sub td{font-weight:600;background:var(--surface-2)}
table.t td.ind1{padding-left:26px} table.t td.ind2{padding-left:42px}
.check{display:flex;align-items:center;gap:8px;font-size:var(--t-meta);color:var(--text-2);margin-top:10px}
.check.ok{color:var(--ok)} .check.bad{color:var(--bad)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-s);font-size:var(--t-meta);border:var(--bw) solid var(--border);background:var(--surface-2);color:var(--text-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.note.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai-ink)}
:root[data-theme="hc"] .note{border-color:currentColor}
.note b{color:inherit}
.empty{text-align:center;padding:48px 24px;color:var(--text-2)}
.empty .ico{width:36px;height:36px;color:var(--text-3);margin-bottom:10px}
.empty h2{margin-bottom:6px;color:var(--text)}
.empty p{max-width:420px;margin:0 auto 14px}
.skel{background:linear-gradient(90deg,var(--sunken),var(--hover),var(--sunken));background-size:200% 100%;border-radius:var(--r-xs);height:12px;animation:skel 1.4s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.hr{height:1px;background:var(--border);margin:10px 0}

/* ---------- KPIs and home ---------- */
.kpi{display:block;width:100%;text-align:left;padding:14px 16px}
.kpi:hover{border-color:var(--accent)}
.kpi .lbl{color:var(--text-2);display:flex;justify-content:space-between;align-items:center}
.kpi .fig{font-size:var(--t-fig);font-weight:650;letter-spacing:-.02em;margin:6px 0 2px;white-space:nowrap}
.kpi .fig small{font-size:16px;font-weight:500;color:var(--text-3);margin-right:2px}
.kpi .foot{font-size:var(--t-meta);color:var(--text-3)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:var(--t-cap);color:var(--text-3)}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
.bars .b.cur i{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,var(--accent-soft) 4px 7px)}
.qe{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 12px;border:var(--bw) solid var(--border-strong);border-radius:var(--r-m);background:var(--surface)}
.qe input{flex:1;border:0;height:30px;padding:0;outline:none!important;background:transparent}
.qe:focus-within{outline:2px solid var(--accent)}
.launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.launch button{min-width:0}
.launch button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);border:var(--bw) solid var(--border)}
.launch button:hover{background:var(--hover);border-color:var(--border-strong)}
.launch button span{flex:1}

/* ---------- AI proposal component (one shape for every flow) ---------- */
.prop{border:var(--bw) dashed var(--ai);border-left:4px solid var(--ai);background:var(--surface);border-radius:var(--r-m);overflow:clip}
:root[data-theme="hc"] .prop{border-style:dashed;border-width:2px;border-left-width:6px}
.prop .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--ai-soft);color:var(--ai-ink)}
.prop .ph .k{font-weight:650}
.prop .ph .src{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--t-meta)}
.prop .pb{padding:12px 14px}
.prop .pf{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:var(--bw) solid var(--border);background:var(--surface-2)}
.prop .pf .why{margin-right:auto;font-size:var(--t-meta);color:var(--text-2)}
.prop.done{border-style:solid;border-color:var(--ok);border-left-color:var(--ok)}
.prop.done .ph{background:var(--ok-soft);color:var(--ok)}
.prop.rejected{border-color:var(--border-strong);border-left-color:var(--border-strong)}
.prop.rejected .ph{background:var(--sunken);color:var(--text-2)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-meta);font-weight:600}
.conf i{display:inline-flex;gap:2px}
.conf i b{width:5px;height:12px;border-radius:1px;background:currentColor;opacity:.25}
.conf[data-l="3"] i b,.conf[data-l="2"] i b:nth-child(-n+2),.conf[data-l="1"] i b:first-child{opacity:1}
.conf[data-l="rule"]{color:var(--text-2)}
.src-chip{display:inline-flex;gap:5px;align-items:center;padding:0 7px;line-height:20px;border-radius:var(--r-xs);background:var(--surface);color:var(--text-2);border:var(--bw) solid var(--border);font-size:var(--t-meta);white-space:nowrap}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:var(--t-meta)}
.checks li{display:flex;gap:8px;align-items:center;color:var(--text-2)}
.checks li.ok{color:var(--ok)} .checks li.bad{color:var(--bad)} .checks li.warn{color:var(--warn)}
.prov{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;line-height:16px;white-space:nowrap}
.prov.doc,.prov.ai{background:var(--ai-soft);color:var(--ai-ink)}
.prov.you{background:var(--sunken);color:var(--text-2)}
.prov.eng{background:var(--ok-soft);color:var(--ok)}
.prov.books{background:var(--accent-soft);color:var(--accent-ink)}
.prov.rule{background:var(--sunken);color:var(--text-2)}
.aifield{background:var(--ai-soft)!important;border-color:var(--ai)!important;border-style:dashed!important}
.aifield.blank{background:var(--surface)!important;border-color:var(--bad)!important;border-style:solid!important}
.bind{display:inline-flex;align-items:center;padding:0 5px;border-radius:3px;background:var(--ok-soft);color:var(--ok);font-weight:600;white-space:nowrap}
.bind.q{background:var(--sunken);color:var(--text)}

/* ---------- forms / voucher ---------- */
.vsheet{padding:0}
.vhead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;padding:16px;border-bottom:var(--bw) solid var(--border)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:var(--t-meta);color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:center}
.fld .hint{font-size:var(--t-meta);color:var(--text-3)}
.fld .err{font-size:var(--t-meta);color:var(--bad);display:flex;gap:6px;align-items:center}
.fld input.invalid{border-color:var(--bad);outline-color:var(--bad)}
.fld.span2{grid-column:span 2}
.ro{height:32px;display:flex;align-items:center;font-size:var(--t-input);color:var(--text)}
table.lines{width:100%;border-collapse:collapse}
table.lines th{font-size:var(--t-meta);font-weight:600;color:var(--text-3);text-align:left;padding:8px 8px;border-bottom:var(--bw) solid var(--border);background:var(--surface-2)}
table.lines td{padding:4px 8px;border-bottom:var(--bw) solid var(--border)}
table.lines td input{width:100%;height:30px;border-color:transparent;background:transparent}
table.lines td input:hover{border-color:var(--border)}
table.lines td input:focus{background:var(--surface);border-color:var(--accent)}
table.lines td.n{width:30px;color:var(--text-3);font-size:var(--t-meta);text-align:center}
table.lines tr.active td{background:var(--accent-soft)}
table.lines input.num{text-align:right}
.vfoot{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:14px 16px}
.taxbox{border:var(--bw) solid var(--border);border-radius:var(--r-s);overflow:hidden}
.taxrow{display:flex;justify-content:space-between;padding:6px 12px;font-size:var(--t-body)}
.taxrow.tot{font-weight:700;font-size:var(--t-h2);border-top:var(--bw) solid var(--text-2);background:var(--surface-2)}
.taxrow .lab{display:flex;gap:6px;align-items:center;color:var(--text-2)}
.pos{display:flex;gap:8px;align-items:center;font-size:var(--t-meta);padding:8px 12px;border-radius:var(--r-s);background:var(--surface-2);border:var(--bw) solid var(--border);color:var(--text-2)}
.words{font-size:var(--t-meta);color:var(--text-2);margin-top:8px}
.flash{animation:flash var(--dur-emph) var(--ease-out)}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.lockbar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bad-soft);color:var(--bad);font-size:var(--t-meta);border-bottom:var(--bw) solid var(--border)}

/* typeahead */
.ta{position:fixed;z-index:60;min-width:340px;max-width:460px;background:var(--surface);border:var(--bw) solid var(--border-strong);border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:6px;display:none}
.ta.open{display:block}
.ta .cap{font-size:var(--t-cap);font-weight:600;color:var(--text-3);padding:4px 8px}
.ta .opt{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:var(--r-xs);cursor:pointer}
.ta .opt .s{color:var(--text-3);font-size:var(--t-meta)}
.ta .opt.hi{background:var(--accent-soft);color:var(--accent-ink)}
.ta .opt.hi .s{color:var(--accent-ink)}
.ta mark{background:none;color:inherit;text-decoration:underline;font-weight:700}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding-top:72px}
.palette{width:640px;max-width:calc(100vw - 32px);background:var(--surface);border:var(--bw) solid var(--border-strong);border-radius:var(--r-l);box-shadow:var(--shadow-2);overflow:hidden}
.palette .pin{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:var(--bw) solid var(--border)}
.palette .pin input{flex:1;border:0;height:28px;font-size:16px;padding:0;outline:none!important;background:transparent}
.palette .modes{display:flex;gap:6px;padding:8px 14px;border-bottom:var(--bw) solid var(--border);font-size:var(--t-meta);color:var(--text-3);flex-wrap:wrap}
.palette .res{max-height:420px;overflow:auto;padding:6px}
.palette .sec{font-size:var(--t-cap);font-weight:600;color:var(--text-3);padding:8px 10px 4px}
.palette .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer}
.palette .it .main{flex:1;min-width:0}
.palette .it .main small{display:block;color:var(--text-3);font-size:var(--t-meta)}
.palette .it.hi{background:var(--accent-soft);color:var(--accent-ink)}
.palette .it.hi small{color:var(--accent-ink)}
.palette .pfoot{display:flex;gap:14px;padding:8px 14px;border-top:var(--bw) solid var(--border);font-size:var(--t-meta);color:var(--text-3);background:var(--surface-2)}
.palette .pfoot span{display:inline-flex;gap:5px;align-items:center}
.dialog{width:520px;max-width:calc(100vw - 32px);background:var(--surface);border:var(--bw) solid var(--border-strong);border-radius:var(--r-l);box-shadow:var(--shadow-2);padding:18px 20px}
.dialog h2{margin-bottom:8px}
.dialog .actions{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:90;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:var(--r-m);box-shadow:var(--shadow-2);display:none;align-items:center;gap:10px;font-weight:500}
.toast.on{display:flex}
.toast button{color:var(--surface);text-decoration:underline;font-weight:600}
.pop{position:absolute;z-index:50;background:var(--surface);border:var(--bw) solid var(--border-strong);border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:12px 14px}

/* bill image (fictional document, drawn in HTML) */
.billwrap{position:relative;background:var(--sunken);border-radius:var(--r-m);padding:18px;display:flex;justify-content:center;overflow:hidden;min-height:520px}
.bill{position:relative;width:360px;background:#FDFCF7;color:#2A2723;font:11px/1.45 "Courier New",monospace;padding:18px 18px 22px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bill h4{margin:0;font:700 14px/1.2 Georgia,serif;text-align:center}
.bill .c{text-align:center}
.bill table{width:100%;border-collapse:collapse;margin-top:8px}
.bill td,.bill th{border-bottom:1px dotted #8a857a;padding:3px 2px;text-align:left;font-weight:400}
.bill .r{text-align:right}
.bill .smudge{color:#CFC8BA}
.bbox{position:absolute;border:1.5px solid var(--ai);border-radius:3px;background:color-mix(in srgb,var(--ai) 10%,transparent);pointer-events:none}
.bbox.on{border-width:3px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 30%,transparent)}
.bbox.on span,.bbox.lowc span{display:block}
.bbox.lowc{border-style:dashed;border-color:var(--bad)}
.bbox span{display:none;position:absolute;top:-17px;left:-2px;font:600 10px/15px Inter,sans-serif;background:var(--ai);color:var(--surface);padding:0 4px;border-radius:3px 3px 0 0;white-space:nowrap}

/* setup */
.setup{display:grid;grid-template-columns:240px 1fr;gap:0;max-width:980px;margin:12px auto}
.steps{padding:18px 8px;border-right:var(--bw) solid var(--border)}
.steps button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:var(--r-s);color:var(--text-2)}
.steps button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:var(--t-cap);font-weight:700;border:var(--bw) solid var(--border-strong)}
.steps button.done i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.steps button[aria-current="step"] i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spane{padding:22px 28px}
.opt-card{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:var(--bw) solid var(--border);border-radius:var(--r-m);width:100%;text-align:left}
.opt-card:hover{border-color:var(--border-strong)}
.opt-card[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt-card .ico{margin-top:2px}
.opt-card p{color:var(--text-2);font-size:var(--t-meta);margin-top:2px}
.switch{width:34px;height:20px;border-radius:10px;background:var(--border-strong);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left var(--dur-fast) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:16px}

/* keyboard map */
.kmap{columns:3 300px;column-gap:16px}
.kmap .card{break-inside:avoid;margin-bottom:12px}
.kmap table td{padding:5px 10px}
.kmap table td:first-child{white-space:nowrap}

/* ---------- motion: named, CSS-driven, freezable. See transitions.json ---------- */
.tx{animation-duration:var(--tx-dur);animation-timing-function:var(--tx-ease);animation-fill-mode:both}
@keyframes push-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop-in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes scale-in{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes scale-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes drill-in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drill-out{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes arrive{0%{opacity:0;transform:translateY(12px)}40%{opacity:1;transform:none;box-shadow:0 0 0 0 transparent}70%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ai) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes accept-out{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 40%,transparent)}100%{opacity:0;transform:scale(.985)}}
@keyframes reject-out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-32px)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toast-out{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,10px)}}
@keyframes hilite{0%{background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}
@keyframes row-hilite{0%{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--accent) 22%,transparent)}100%{box-shadow:inset 0 0 0 999px transparent}}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:2px;padding:0 1px}
.theme-veil{position:fixed;inset:0;z-index:200;pointer-events:none}
.frozen *,.frozen *::before,.frozen *::after{transition:none!important}
.frozen .skel{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.tx{animation-duration:1ms!important}.skel{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"><header class="top" id="top"></header><nav class="side" id="nav" aria-label="Main"></nav><main id="main"><div id="stage"></div></main><footer class="keys" id="keys" aria-label="Keys for this screen"></footer></div>
<div id="overlay"></div><div class="ta" id="ta" role="listbox"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="registry" type="application/json">
{
"version": 1,
"viewport": {"width": 1280, "height": 800},
"themes": ["light", "dark", "hc"],
"url": "index.html#{hash}&theme={theme}",
"ready": "document.documentElement.dataset.ready === '1'",
"states": [
 {"id":"home.default","kind":"happy","hash":"screen=home&state=default","title":"Home","description":"Dashboard: engine KPIs, plain-words entry bar, review queue and rule-based nudges."},
 {"id":"home.loading","kind":"loading","hash":"screen=home&state=loading","title":"Home, company opening","description":"Skeleton rows while the company file opens and projections load; no figure is shown until the engine returns it."},
 {"id":"home.empty","kind":"empty","hash":"screen=home&state=empty","title":"Home, new company","description":"A new company with no vouchers: first steps instead of zero-filled KPIs."},
 {"id":"home.ai-off","kind":"offline-ai","hash":"screen=home&state=ai-off","title":"Home, AI off","description":"AI tier Off: no AI cards or entry bar, rule-based nudges still shown, top bar says AI off."},
 {"id":"home.nudge-open","kind":"happy","hash":"screen=home&state=nudge-open","title":"Home, duplicate-bill nudge open","description":"Anomaly nudge expanded: possible duplicate purchase bill, with rule source and accept, edit, reject."},
 {"id":"palette.default","kind":"happy","hash":"screen=palette&base=home","title":"Command palette","description":"Palette over Home with recents, prefixes and key hints; Enter opens on top, Shift+Enter replaces."},
 {"id":"palette.search","kind":"happy","hash":"screen=palette&base=home&query=bal","title":"Palette, search 'bal'","description":"Fuzzy results across reports, ledgers and commands for the fragment 'bal'."},
 {"id":"palette.voucher","kind":"happy","hash":"screen=palette&base=home&query=%230412","title":"Palette, voucher number","description":"The # prefix finds a voucher by number and shows party, date and engine amount."},
 {"id":"palette.ask","kind":"happy","hash":"screen=palette&base=home&query=%3Fwho%20owes%20us%20for%20more%20than%2030%20days","title":"Palette, ask your books","description":"The ? prefix turns a question into a report query; the preview shows the query, not an answer."},
 {"id":"palette.entry","kind":"happy","hash":"screen=palette&base=home&query=%2Bpaid%20rent%2025k%20to%20Sharma%20Properties%20from%20Saptagiri","title":"Palette, plain-words entry","description":"The + prefix drafts a voucher from plain words; Enter opens the draft for review."},
 {"id":"palette.commands","kind":"happy","hash":"screen=palette&base=home&query=%3E","title":"Palette, commands","description":"The > prefix lists commands with their keys."},
 {"id":"palette.no-results","kind":"empty","hash":"screen=palette&base=home&query=zzqx","title":"Palette, no results","description":"No match: offers to create a ledger, ask as a question, or search vouchers."},
 {"id":"ask.result","kind":"happy","hash":"screen=ask&state=result","title":"Ask your books, result","description":"Question compiled to a visible ReportQuery; the engine ran it and renders a drillable table; prose carries no digits."},
 {"id":"ask.loading","kind":"loading","hash":"screen=ask&state=loading","title":"Ask your books, building query","description":"The local model is turning the question into a query; cancellable with Esc."},
 {"id":"ask.low-confidence","kind":"low-confidence","hash":"screen=ask&state=low-confidence","title":"Ask your books, ambiguous","description":"Two readings of 'top customers'; the user picks one before anything runs."},
 {"id":"ask.unsupported","kind":"error","hash":"screen=ask&state=unsupported","title":"Ask your books, unsupported","description":"A forecast question: no report can answer it, so the app says Unsupported and offers related reports."},
 {"id":"ask.offline-ai","kind":"offline-ai","hash":"screen=ask&state=offline-ai","title":"Ask your books, AI off","description":"AI is off for this company; the question box offers the report list and filters instead."},
 {"id":"sales-invoice.default","kind":"happy","hash":"screen=sales-invoice&state=default","title":"Sales invoice, intra-state","description":"F8 item invoice to a Maharashtra party: CGST + SGST recomputed live on every keystroke."},
 {"id":"sales-invoice.gst-inter-state","kind":"happy","hash":"screen=sales-invoice&state=gst-inter-state","title":"Sales invoice, inter-state","description":"Party in Gujarat: place of supply differs, so the engine applies IGST."},
 {"id":"sales-invoice.b2c","kind":"happy","hash":"screen=sales-invoice&state=b2c","title":"Sales invoice, unregistered buyer","description":"Cash sale to an unregistered buyer: B2C, no GSTIN, e-invoice not applicable."},
 {"id":"sales-invoice.as-voucher","kind":"happy","hash":"screen=sales-invoice&state=as-voucher","title":"Sales invoice, as voucher","description":"Ctrl+H, As voucher: ledger lines with the CGST and SGST ledgers chosen; the engine fills the party and tax amounts."},
 {"id":"sales-invoice.mode-list","kind":"happy","hash":"screen=sales-invoice&state=mode-list","title":"Sales invoice, change mode","description":"Ctrl+H opens the list of modes: Item Invoice, Accounting Invoice, As Voucher; Enter or a click picks one."},
 {"id":"sales-invoice.item-list","kind":"happy","hash":"screen=sales-invoice&state=item-list","title":"Sales invoice, item list open","description":"Type-ahead over item masters with HSN, rate, GST and stock; Alt+C creates a new item."},
 {"id":"sales-invoice.validation-error","kind":"validation-error","hash":"screen=sales-invoice&state=validation-error","title":"Sales invoice, validation errors","description":"Missing quantity and an unknown item block saving; each error says where and what to do."},
 {"id":"sales-invoice.period-locked","kind":"period-locked","hash":"screen=sales-invoice&state=period-locked","title":"Sales invoice, period locked","description":"Date falls on or before the lock date 31 Oct 2026: saving is blocked and the reason is shown."},
 {"id":"sales-invoice.save-confirm","kind":"happy","hash":"screen=sales-invoice&state=save-confirm","title":"Sales invoice, confirm save","description":"Enter on the last field asks to save; Ctrl+A saves from anywhere."},
 {"id":"sales-invoice.saved","kind":"happy","hash":"screen=sales-invoice&state=saved","title":"Sales invoice, saved","description":"A fresh invoice opens after saving, with a toast naming the voucher saved."},
 {"id":"purchase-bill.reading","kind":"loading","hash":"screen=purchase-bill&state=reading","title":"Bill photo, reading","description":"A bill photo is being read on this computer; the image never leaves the machine."},
 {"id":"purchase-bill.proposal","kind":"happy","hash":"screen=purchase-bill&state=proposal","title":"Bill photo, draft purchase","description":"Draft purchase voucher from a bill photo: transcribed fields with boxes on the image, engine totals and checks."},
 {"id":"purchase-bill.low-confidence","kind":"low-confidence","hash":"screen=purchase-bill&state=low-confidence","title":"Bill photo, field left blank","description":"One rate could not be read with enough confidence, so it is blank and Accept waits for it."},
 {"id":"purchase-bill.mismatch","kind":"validation-error","hash":"screen=purchase-bill&state=mismatch","title":"Bill photo, total mismatch","description":"Printed total differs from the engine total of the lines; Accept is blocked until resolved."},
 {"id":"purchase-bill.duplicate","kind":"validation-error","hash":"screen=purchase-bill&state=duplicate","title":"Bill photo, possible duplicate","description":"Same supplier and bill number already posted; the draft shows the existing voucher."},
 {"id":"purchase-bill.offline-ai","kind":"offline-ai","hash":"screen=purchase-bill&state=offline-ai","title":"Bill photo, AI off","description":"Bill reading is off for this company; the purchase form stays available with the image beside it."},
 {"id":"purchase-bill.cloud-consent","kind":"low-confidence","hash":"screen=purchase-bill&state=cloud-consent","title":"Bill photo, cloud consent","description":"Local reading was weak; the user may send this one image to their own cloud key, with redaction listed."},
 {"id":"purchase-bill.error","kind":"error","hash":"screen=purchase-bill&state=error","title":"Bill photo, unreadable file","description":"The file is a password-protected PDF; the error says what failed and what to do."},
 {"id":"purchase-bill.accepted","kind":"happy","hash":"screen=purchase-bill&state=accepted","title":"Bill photo, accepted","description":"The draft is posted as PB/0145 after the human accepted it; the audit note records the AI source."},
 {"id":"quick-entry.proposal","kind":"happy","hash":"screen=quick-entry&state=proposal","title":"Plain-words entry, draft payment","description":"'paid rent 25k to Sharma Properties from Saptagiri' becomes a draft payment with each value traced."},
 {"id":"quick-entry.hinglish","kind":"happy","hash":"screen=quick-entry&state=hinglish","title":"Plain-words entry, Hinglish","description":"Hinglish text becomes a draft receipt against an open bill and links the matching bank line."},
 {"id":"quick-entry.unknown-ledger","kind":"validation-error","hash":"screen=quick-entry&state=unknown-ledger","title":"Plain-words entry, unknown name","description":"No ledger named 'Ramesh': the draft refuses to invent one and asks to pick or create."},
 {"id":"quick-entry.loading","kind":"loading","hash":"screen=quick-entry&state=loading","title":"Plain-words entry, drafting","description":"The local model is drafting; the text stays editable and Esc cancels."},
 {"id":"quick-entry.rejected","kind":"happy","hash":"screen=quick-entry&state=rejected","title":"Plain-words entry, rejected","description":"The user rejected the draft; nothing was posted and an optional reason is asked."},
 {"id":"payment.default","kind":"happy","hash":"screen=payment&state=default","title":"Payment","description":"F5 payment in single-entry style: bank balance now and after saving."},
 {"id":"payment.bill-wise","kind":"happy","hash":"screen=payment&state=bill-wise","title":"Payment, bill allocation","description":"Paying a supplier pops the bill-wise allocation with open bills from the engine."},
 {"id":"payment.overdraft","kind":"validation-error","hash":"screen=payment&state=overdraft","title":"Payment, overdraft warning","description":"Amount exceeds the bank balance: a warning, with the shortfall computed by the engine."},
 {"id":"receipt.default","kind":"happy","hash":"screen=receipt&state=default","title":"Receipt","description":"F6 receipt against an open sales bill."},
 {"id":"balance-sheet.default","kind":"happy","hash":"screen=balance-sheet&state=default","title":"Balance sheet","description":"Condensed balance sheet as at 20 Nov 2026 with a 'both sides agree' check."},
 {"id":"balance-sheet.detailed","kind":"happy","hash":"screen=balance-sheet&state=detailed","title":"Balance sheet, detailed","description":"Alt+F1 expands every group to ledgers."},
 {"id":"balance-sheet.group","kind":"happy","hash":"screen=balance-sheet&state=group","title":"Balance sheet, group drill","description":"Drilled into Sundry debtors: ledgers with balances that sum to the group figure."},
 {"id":"balance-sheet.ledger","kind":"happy","hash":"screen=balance-sheet&state=ledger","title":"Balance sheet, ledger vouchers","description":"Shree Ganesh Traders: opening, vouchers and running balance."},
 {"id":"balance-sheet.voucher","kind":"happy","hash":"screen=balance-sheet&state=voucher","title":"Balance sheet, voucher","description":"Voucher SI/0412 read-only, with its audit line."},
 {"id":"balance-sheet.loading","kind":"loading","hash":"screen=balance-sheet&state=loading","title":"Balance sheet, computing","description":"Report is computing; cancellable; the last result is never shown as current."},
 {"id":"balance-sheet.provisional","kind":"error","hash":"screen=balance-sheet&state=provisional","title":"Balance sheet, provisional stock","description":"Negative stock makes closing stock Provisional; the figure is marked and explained, never silently used."},
 {"id":"day-book.default","kind":"happy","hash":"screen=day-book&state=default","title":"Day book","description":"Vouchers for 20 Nov 2026, with who entered them and whether a draft came from AI."},
 {"id":"day-book.month","kind":"happy","hash":"screen=day-book&state=month","title":"Day book, 1 to 20 Nov","description":"Period view of every November voucher."},
 {"id":"day-book.empty","kind":"empty","hash":"screen=day-book&state=empty","title":"Day book, no vouchers","description":"21 Nov 2026 has no vouchers yet; offers voucher keys."},
 {"id":"gst.gstr1","kind":"happy","hash":"screen=gst&state=gstr1","title":"GSTR-1, November","description":"Sections built from sales vouchers with exception buckets: Ready, Not relevant, Mismatch, Needs correction."},
 {"id":"gst.gstr1-correction","kind":"validation-error","hash":"screen=gst&state=gstr1-correction","title":"GSTR-1, needs correction","description":"An item with no HSN code holds back the HSN summary; drill to the master to fix."},
 {"id":"gst.gstr3b","kind":"happy","hash":"screen=gst&state=gstr3b","title":"GSTR-3B working, November","description":"Outward tax, ITC from accepted 2B records and engine set-off; books vs portal columns."},
 {"id":"gst.recon","kind":"happy","hash":"screen=gst&state=recon","title":"2B and IMS reconciliation","description":"Engine match status per 2B record and a suggested IMS action the user must confirm."},

 {"id":"gst.recon-locked","kind":"period-locked","hash":"screen=gst&state=recon-locked","title":"2B reconciliation, October final","description":"GSTR-3B for October is filed, so IMS actions for October are final and read-only."},
 {"id":"bank.default","kind":"happy","hash":"screen=bank&state=default","title":"Bank reconciliation","description":"Statement lines with Exact, Rule, AI-suggested and unmatched status."},
 {"id":"bank.ai-suggestions","kind":"happy","hash":"screen=bank&state=ai-suggestions","title":"Bank, AI suggestions","description":"Filtered to AI suggestions; the selected line shows its proposal, reason and confidence."},
 {"id":"bank.suggested-ledger","kind":"happy","hash":"screen=bank&state=suggested-ledger","title":"Bank, suggested new ledger","description":"Lines with no fitting ledger: a proposal to create one, built from the narrations."},
 {"id":"bank.empty","kind":"empty","hash":"screen=bank&state=empty","title":"Bank, no statement","description":"No statement imported for this account; import from CSV, XLSX or MT940."},
 {"id":"bank.import-error","kind":"error","hash":"screen=bank&state=import-error","title":"Bank, balance check failed","description":"Opening plus lines does not equal the closing balance in the file; the import is refused."},
 {"id":"bank.offline-ai","kind":"offline-ai","hash":"screen=bank&state=offline-ai","title":"Bank, AI off","description":"Only exact and rule matches; leftover lines wait for manual matching."},
 {"id":"bank.brs","kind":"happy","hash":"screen=bank&state=brs","title":"Bank reconciliation statement","description":"Balance as per books, each entry the bank has not cleared under its total, the balance as per bank, the statement's balance and the difference."},
 {"id":"bank.brs-exported","kind":"happy","hash":"screen=bank&state=brs-exported","title":"Bank reconciliation statement, exported","description":"Ctrl+E wrote the statement to a CSV or XLSX file; a note says where it went."},
 {"id":"masters.ledgers","kind":"happy","hash":"screen=masters&state=ledgers","title":"Masters, ledgers","description":"Ledgers by group with engine balances; filter as you type."},
 {"id":"masters.ledger-detail","kind":"happy","hash":"screen=masters&state=ledger-detail","title":"Masters, party detail","description":"Party ledger: GSTIN with check, state, credit days, open bills."},

/* ---------- helpers ---------- */
const dnum = d => {const [dd,mm,yy]=d.split('-').map(Number);return Date.UTC(yy,mm-1,dd)/864e5};
const ddiff = (a,b) => dnum(a)-dnum(b);
const half = (num,den) => { // integer half-up division for non-negative num
  const q=Math.floor(num/den), r=num-q*den; return (2*r>=den)?q+1:q; };
const NF = new Intl.NumberFormat('en-IN');
function inr(p){ // paise -> "1,23,456.78" (Indian grouping), integer arithmetic only
  const neg=p<0; const a=Math.abs(p); const rs=Math.floor(a/100), ps=a%100;
  return (neg?'-':'')+NF.format(rs)+'.'+String(ps).padStart(2,'0'); }
const rupee = p => '₹'+inr(p);
function words(p){
  const n=Math.floor(Math.abs(p)/100), ps=Math.abs(p)%100;
  const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?'-'+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  if(n===0&&ps===0)return 'Zero rupees';
  let r=n,out=[];const cr=Math.floor(r/1e7);r%=1e7;const lk=Math.floor(r/1e5);r%=1e5;const th=Math.floor(r/1e3);r%=1e3;
  if(cr)out.push(three(cr)+' crore');if(lk)out.push(two(lk)+' lakh');if(th)out.push(two(th)+' thousand');if(r)out.push(three(r));
  let s=(out.join(' ')||'zero')+' rupees';if(ps)s+=' and '+two(ps)+' paise';
  return s.charAt(0).toUpperCase()+s.slice(1)+' only'; }

/* ---------- GSTIN check character (mod 36, alternating weights) ---------- */
const GC='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gstinCheck(g){
  g=(g||'').toUpperCase().trim();
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return {ok:false,reason:'A GSTIN has 15 characters: 2-digit state code, 10-character PAN, entity number, Z, check character.'};
  let s=0;for(let i=0;i<14;i++){const p=GC.indexOf(g[i])*(i%2?2:1);s+=Math.floor(p/36)+p%36}
  const c=GC[(36-s%36)%36];
  if(c!==g[14]) return {ok:false,expected:c,reason:`Check character should be ${c}, not ${g[14]}. One of the first 14 characters is probably mistyped.`};
  if(!STATES[g.slice(0,2)]) return {ok:true,state:g.slice(0,2),stateName:'state code '+g.slice(0,2)};
  return {ok:true,state:g.slice(0,2),stateName:STATES[g.slice(0,2)]}; }

/* ---------- GST on an item invoice (rule pack "illustrative 2026.11") ---------- */
function computeInvoice(lines,posState){
  const inter=posState!==CO.state; const groups={}; let taxable=0; const out=[];
  for(const l of lines){
    const it=ITEM[l.item]; if(!it||!(l.qty>0)||!(l.rate>0)){out.push(null);continue}
    const v=l.qty*l.rate; taxable+=v; out.push(v);
    const g=groups[it.gst]||(groups[it.gst]={rate:it.gst,taxable:0}); g.taxable+=v; }
  let cgst=0,sgst=0,igst=0;
  const rows=Object.values(groups).sort((x,y)=>x.rate-y.rate).map(g=>{
    if(inter){const t=half(g.taxable*g.rate,100);igst+=t;return {...g,igst:t}}
    const h=half(g.taxable*g.rate,200);cgst+=h;sgst+=h;return {...g,cgst:h,sgst:h}});
  const gross=taxable+cgst+sgst+igst; const total=half(gross,100)*100; const ro=total-gross;
  return {inter,rows,taxable,cgst,sgst,igst,gross,total,ro,lineAmts:out}; }

/* post a voucher: returns [[ledger, signed paise]] */
function postings(v){
  if(v.type==='Sales'){
    const p=LED[v.party]; const inv=computeInvoice(v.lines.map(([item,qty,rate])=>({item,qty,rate})),p.st);
    const party=v.paidTo||v.party; const out=[[party,inv.total],['sales',-inv.taxable]];
    if(inv.igst)out.push(['igstout',-inv.igst]); if(inv.cgst){out.push(['cgstout',-inv.cgst]);out.push(['sgstout',-inv.sgst])}
    if(inv.ro)out.push(['roundoff',-inv.ro]); return out; }
  return [...v.dr.map(([l,a])=>[l,a]),...v.cr.map(([l,a])=>[l,-a])]; }

/* The provisional-stock scenario (the *.provisional states of the balance sheet, profit and loss and stock
   summary). It is a what-if on top of the sample company, the same two vouchers the app's capture adds:
   on 19 Nov a counter sale of 174 Steel pickaxes (SI/0416, cash) when 144 are on hand (150 bought 15 Oct,
   6 sold on SI/0415), so the item is 30 nos below zero; on 20 Nov a purchase of 100 at 470.00 (Rupa Polymers,
   Gujarat, so IGST) brings it back to 70. The engine marks the value Provisional because the quantity went
   below zero on 19 Nov, and keeps the figure.
   Hand check: sale 174 x 640.00 = 1,11,360.00, CGST+SGST 5% = 2,784.00 + 2,784.00, total 1,16,928.00 (cash);
   purchase 100 x 470.00 = 47,000.00, IGST 5% = 2,350.00, total 49,350.00. Pickaxe closing 144 - 174 + 100 = 70,
   value 70 x 470.00 = 32,900.00 (every pickaxe in stock was bought at 470.00, so the average cost is 470.00). */
const SHORT_VOUCHERS = [
 {id:'SI/0416',type:'Sales',date:'19-11-2026',party:'cashsale',lines:[['pick',174,R(640)]],paidTo:'cash',narr:'Counter sale'},
 {id:'PB/0145',type:'Purchase',date:'20-11-2026',party:'rupa',dr:[['purch',R(47000)],['igstin',R(2350)]],cr:[['rupa',R(49350)]],stock:[['pick',100]],narr:'Pickaxes'}];
function stockPosition(short){
  const q=Object.fromEntries(ITEMS.map(i=>[i.id,i.qty])); const low={};
  for(const v of [...VOUCHERS,...(short?SHORT_VOUCHERS:[])]){
    if(v.type==='Sales')for(const [it,n] of v.lines){q[it]-=n;if(q[it]<0&&!low[it])low[it]=v.date}
    else for(const [it,n] of v.stock||[])q[it]+=n; }
  const neg=ITEMS.filter(i=>low[i.id]);
  const value=ITEMS.reduce((s,i)=>s+Math.max(q[i.id],0)*i.cost,0);
  return {qty:q,value,provisional:neg.length?{reason:'NegativeStock',items:neg.map(i=>i.name),first:neg.map(i=>low[i.id])[0]}:null}; }
function groupOf(id){return GROUPS.find(g=>g.id===id)}
function rootOf(gid){let g=groupOf(gid);while(g.parent)g=groupOf(g.parent);return g}
function balanceSheet(opt){
  opt=opt||{}; const b=balances(opt.short?SHORT_VOUCHERS:[]); const st=stockPosition(opt.short);
  const pl=LEDGERS.filter(l=>['I','E'].includes(rootOf(l.group).nature)).reduce((s,l)=>s+b[l.id],0);
  const profit=-pl+st.value; // Cr positive
  const node=(gid,sign)=>{const g=groupOf(gid);
    const kids=GROUPS.filter(x=>x.parent===gid).map(x=>node(x.id,sign));
    const leds=LEDGERS.filter(l=>l.group===gid).map(l=>({kind:'ledger',id:l.id,name:l.name,amt:sign*b[l.id]}));
    if(gid==='stock')leds.push({kind:'stock',id:'stock',name:'Stock in hand (stock engine, average cost)',amt:st.value,provisional:st.provisional});
    const children=[...kids,...leds]; return {kind:'group',id:gid,name:g.name,children,amt:children.reduce((s,c)=>s+c.amt,0)}};
  const liab=['capital','loans','curliab'].map(g=>node(g,-1));
  liab.push({kind:'pl',id:'pl',name:'Profit and loss account',children:[{kind:'ledger',id:'plcur',name:'Profit, 1 Apr to 20 Nov 2026',amt:profit}],amt:profit});
  const assets=['fixed','curassets'].map(g=>node(g,1));
  const L=liab.reduce((s,n)=>s+n.amt,0), A=assets.reduce((s,n)=>s+n.amt,0);
  return {liab,assets,L,A,agree:L===A,stock:st,profit}; }
function findNode(tree,id){for(const n of tree){if(n.id===id)return n;if(n.children){const f=findNode(n.children,id);if(f)return f}}return null}
function groupTotal(gid){const bs=balanceSheet();return findNode([...bs.liab,...bs.assets],gid).amt}

function gstr3b(actions){

  for(const v of NOV_SALES()){const inv=computeInvoice(v.lines.map(([item,qty,rate])=>({item,qty,rate})),LED[v.party].st);
    out.taxable+=inv.taxable;out.igst+=inv.igst;out.cgst+=inv.cgst;out.sgst+=inv.sgst}
  const acts=actions||{}; const itc={igst:0,cgst:0,sgst:0}, deemed={igst:0,cgst:0,sgst:0};

    if(a===null){deemed.igst+=r.igst;deemed.cgst+=r.cgst;deemed.sgst+=r.sgst}}
  const books={igst:0,cgst:0,sgst:0};
  for(const v of VOUCHERS.filter(x=>x.type==='Purchase'))for(const [l,a] of v.dr){if(l==='igstin')books.igst+=a;if(l==='cgstin')books.cgst+=a;if(l==='sgstin')books.sgst+=a}

  const liab={igst:out.igst,cgst:out.cgst,sgst:out.sgst}; const c={...itc}; const use=(from,to,max)=>{const u=Math.min(c[from],liab[to],max===undefined?Infinity:max);c[from]-=u;liab[to]-=u};

  use('cgst','cgst');use('sgst','sgst');use('cgst','igst');use('sgst','igst');
  const cash={igst:half(liab.igst,100)*100,cgst:half(liab.cgst,100)*100,sgst:half(liab.sgst,100)*100};

function brs(accepted){
  /* the reconciliation statement as the accounting package's help page gives it: the books balance, the entries the bank has not cleared (deposits are subtracted, payments added back), the balance as per bank, the imported statement's closing balance and the difference. An entry is cleared once its match is confirmed. */
  const b=balances().saptagiri; const acc=accepted||{};
  const confirmed=new Set(Object.entries(BANK_MATCH).filter(([id,m])=>m.v&&acc[id]).map(([,m])=>m.v));
  const items=VOUCHERS.filter(v=>postings(v).some(([l])=>l==='saptagiri')&&!confirmed.has(v.id)).map(v=>{
    const amt=postings(v).find(x=>x[0]==='saptagiri')[1]; const others=postings(v).filter(x=>x[0]!=='saptagiri').map(x=>LED[x[0]].name);
    return {v,amt,what:[...new Set(others)].join(', ')+(v.chq?' · cheque '+v.chq:'')}; });
  const deposits=items.filter(i=>i.amt>0), payments=items.filter(i=>i.amt<0);
  const dTot=deposits.reduce((s,i)=>s+i.amt,0), pTot=payments.reduce((s,i)=>s-i.amt,0);
  const perBank=b-dTot+pTot;
  return {books:b,deposits,payments,dTot,pTot,perBank,stmt:STMT.close,diff:STMT.close-perBank}; }

function selfCheck(){
  const fails=[];
  for(const v of VOUCHERS){const s=postings(v).reduce((a,x)=>a+x[1],0);if(s!==0)fails.push(v.id+' Dr != Cr by '+s)}
  const tb=Object.values(balances()).reduce((a,x)=>a+x,0); if(tb!==0)fails.push('Trial balance off by '+tb);
  const bs=balanceSheet(); if(!bs.agree)fails.push('Balance sheet sides differ: '+(bs.L-bs.A));
  const s3=gstr3b(); const sumOut=NOV_SALES().reduce((a,v)=>{const p=postings(v);return a+p.filter(x=>['igstout','cgstout','sgstout'].includes(x[0])).reduce((q,x)=>q-x[1],0)},0);
  if(s3.out.igst+s3.out.cgst+s3.out.sgst!==sumOut)fails.push('3B outward tax != voucher tax');
  const g1=gstr1(); const b2bt=g1.sections[0].taxable+g1.sections[2].taxable; if(b2bt!==s3.out.taxable)fails.push('GSTR-1 taxable != 3B taxable');
  if(STMT.lines.reduce((s,l)=>s+l.dep-l.wd,STMT.open)!==STMT.close)fails.push('Statement balance check');

  if(!t){sec.push(['Recent',[['Balance sheet','As at 20 Nov 2026','scale',hashFor('balance-sheet')],['GSTR-1, November','3 sections ready, 1 needs correction','gst',hashFor('gst','gstr1')],['Shree Ganesh Traders','Ledger · Sundry debtors · '+inr(balances().sgt)+' Dr','users',hashFor('balance-sheet','ledger')]]]);
   sec.push(['Type a prefix',[['# voucher number','e.g. #0412','file',null,'#'],['@ party or ledger','name, alias or GSTIN','users',null,'@'],['> command','e.g. > export','sliders',null,'>'],['? ask your books','answer is a report the engine runs','spark',null,'?'],['+ entry in plain words','drafts a voucher for you to review','chat',null,'+']]]);return sec}
  const pre=t[0], body=t.slice(1).trim();
  if(pre==='?'){sec.push(['Ask your books',tierOff?[['AI is off for this company','Use reports and filters, or turn AI on in AI and privacy','off',hashFor('ask','offline-ai')]]:[[`Ask: ${body||'…'}`,'Builds a report query. You see the query and the engine result, never a typed-in number.','spark',hashFor('ask',/top/i.test(body)?'low-confidence':/next|forecast|will/i.test(body)?'unsupported':'result',{q:body})]]]);return sec}
  if(pre==='+'){sec.push(['Entry in plain words',tierOff?[['AI is off for this company','Open the voucher form instead: F5 payment, F6 receipt','off',hashFor('payment')]]:[[`Draft: ${body||'…'}`,'Opens a draft voucher for review. Nothing is saved until you accept.','chat',hashFor('quick-entry',/ se | ko | aaya| diya/i.test(' '+body+' ')?'hinglish':/ramesh/i.test(body)?'unknown-ledger':'proposal',{text:body})]]]);return sec}
  if(pre==='>'){sec.push(['Commands',PAL_CMDS.filter(c=>!body||fuzzy(body,c[0])).map(c=>[c[0],c[1]?'':'','sliders',c[2],null,c[1]])]);return sec}
  if(pre==='#'){const v=VOUCHERS.filter(v=>v.id.includes(body.toUpperCase())||(body&&v.id.replace(/\D/g,'').includes(body)));
   sec.push(['Vouchers',v.map(v=>[`${v.id} · ${v.type}`,`${fmtDate(v.date)} · ${v.party?LED[v.party].name:LED[(v.dr[0]||[])[0]].name} · ₹${inr(vTotal(v))}`,'file',hashFor('balance-sheet','voucher',{v:v.id})])]);return sec}
  const qq=pre==='@'?body:t;
  const sc=PAL_SCREENS.filter(s=>fuzzy(qq,s[0])).sort((a,b)=>fuzzy(qq,b[0])-fuzzy(qq,a[0])).slice(0,5).map(s=>[s[0],'Report or screen','scale'===s[3]?'scale':s[3],hashFor(s[1],s[2])]);
  const lg=LEDGERS.filter(l=>fuzzy(qq,l.name)===2||(l.alias&&l.alias.toLowerCase()===qq.toLowerCase())||(l.gstin&&l.gstin.includes(qq.toUpperCase())&&qq.length>3)).slice(0,6).map(l=>{const bl=balances()[l.id];return [l.name,`Ledger · ${groupOf(l.group).name} · ${inr(Math.abs(bl))} ${bl>=0?'Dr':'Cr'}${l.gstin?' · '+l.gstin:''}`,'users',l.group==='debtors'?hashFor('balance-sheet','ledger',{l:l.id}):hashFor('masters','ledger-detail',{l:l.id})]});
  const cm=PAL_CMDS.filter(c=>fuzzy(qq,c[0])===2).slice(0,3).map(c=>[c[0],'Command','sliders',c[2],null,c[1]]);
  if(sc.length&&pre!=='@')sec.push(['Reports and screens',sc]); if(lg.length)sec.push(['Ledgers',lg]); if(cm.length&&pre!=='@')sec.push(['Commands',cm]);
  if(t.includes(' ')&&!tierOff)sec.push(['Or',[[`Ask: ${t}`,'as a question','spark',hashFor('ask','result',{q:t})],[`Draft: ${t}`,'as an entry','chat',hashFor('quick-entry','proposal',{text:t})]]]);
  if(!sec.length)sec.push(['No match for "'+t+'"',[[`Create ledger "${t}"`,'Opens the ledger form with this name','plus',hashFor('masters','create-ledger',{name:t}),null,'Alt+C'],[`Search vouchers for "${t}"`,'Narrations and party names','search',null,'#'+t],...(tierOff?[]:[[`Ask: ${t}`,'as a question about your books','spark',hashFor('ask','low-confidence',{q:t})]])]]);
  return sec; }

function parseAmt(s){ // inline arithmetic: 25k, 1.5l, 1200*18%, 40+2 (UI parsing only; the app uses a decimal parser)
  s=String(s||'').toLowerCase().replace(/,/g,'').replace(/₹/g,'').trim(); if(!s)return null;
  s=s.replace(/(\d+(?:\.\d+)?)\s*k\b/g,'($1*1000)').replace(/(\d+(?:\.\d+)?)\s*(l|lakh)\b/g,'($1*100000)').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[\d\s.+\-*/()]+$/.test(s))return NaN; try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:NaN}catch(e){return NaN} }
const toPaise = v => v==null||isNaN(v)?null:Math.round(v*100);

const TA={inp:null,list:[],hi:0,kind:null};
function taSource(kind){
  if(kind==='party')return LEDGERS.filter(l=>l.group==='debtors').map(l=>({v:l.name,id:l.id,s:(l.gstin||'Unregistered')+' · '+l.city+' · '+inr(Math.abs(balances()[l.id]))+(balances()[l.id]>=0?' Dr':' Cr')}));
  if(kind==='item')return ITEMS.map(i=>{const q=stockPosition().qty[i.id];return {v:i.name,id:i.id,s:`HSN ${i.hsn||'missing'} · ${i.gst}% · ₹${inr(i.rate)} · ${q} ${i.unit} in stock`}});
  if(kind==='pos')return Object.entries(STATES).map(([k,v])=>({v:k+' '+v,id:k,s:k===CO.state?'Your state: CGST + SGST':'Inter-state: IGST'}));
  if(kind==='ledger')return LEDGERS.filter(l=>!['debtors'].includes(l.group)||true).map(l=>({v:l.name,id:l.id,s:groupOf(l.group).name}));
  return []; }
function taOpen(inp,kind){
  TA.inp=inp;TA.kind=kind;const q=inp.value.trim().toLowerCase();
  const all=taSource(kind);const exact=all.find(o=>o.v.toLowerCase()===q);
  TA.list=exact?all:all.filter(o=>!q||o.v.toLowerCase().includes(q)||o.s.toLowerCase().includes(q));
  TA.hi=Math.max(0,TA.list.findIndex(o=>exact&&o===exact));
  const cap={party:'Parties',item:'Stock items',pos:'Place of supply',ledger:'Ledgers'}[kind];
  const ta=$('#ta');
  ta.innerHTML=`<div class="cap">${cap} · ${TA.list.length} of ${all.length}</div>`+TA.list.slice(0,8).map((o,i)=>`<div class="opt ${i===TA.hi?'hi':''}" data-j="${i}"><span>${hl(o.v,inp.value.trim())}</span><span class="s">${esc(o.s)}</span></div>`).join('')+
   (kind==='pos'?'':`<div class="opt" data-j="-1"><span>${ic('plus')} Create ${kind==='item'?'item':'ledger'}${q?` "${esc(inp.value.trim())}"`:''}</span>${kb('Alt+C')}</div>`);
  const r=inp.getBoundingClientRect();ta.style.left=Math.min(r.left,innerWidth-470)+'px';ta.style.top=(r.bottom+4)+'px';ta.classList.add('open');
  $$('#ta .opt[data-j]').forEach(el=>el.onmousedown=ev=>{ev.preventDefault();TA.hi=+el.dataset.j;taPick()}); }
function taClose(){$('#ta').classList.remove('open');TA.inp=null}
function taPick(){const o=TA.list[TA.hi];if(TA.hi<0||!o){toast('Alt+C opens the master form here, and returns with the new master selected.');return false}
  TA.inp.value=o.v;const inp=TA.inp,kind=TA.kind;taClose();onPick(inp,kind,o);return true}

const addDays = (d,n) => {const [dd,mm,yy]=d.split('-').map(Number);const t=new Date(Date.UTC(yy,mm-1,dd+n));
  return `${String(t.getUTCDate()).padStart(2,'0')}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${t.getUTCFullYear()}`};
const vsheetOpen = fields => `<div class="card vsheet"><div class="vhead">${fields}</div>`;

/* purchase, typed by hand (F9 without the bill reader). Supplier Nilgiri Steel Traders is in Karnataka (29),
   the company is in Maharashtra (27), so the engine applies IGST.
   Place of supply: goods bought for the company's own premises, so 27 Maharashtra (IGST Act s.10(1)(a): the place of supply of goods
   moved to the recipient is where the movement ends; https://taxguru.in/goods-and-service-tax/section-10-igst-act-2017-place-supply-goods.html, read 2026-11-25). Supplier in 29, place of supply 27, so the supply is inter-State and the engine
   charges IGST, never CGST and SGST. The next purchase number in the sample is PB/0145 (highest posted PB/0144).
   Hand check: HDPE 10 x 2,050.00 = 20,500.00; valves 100 x 228.40 = 22,840.00; taxable 43,340.00;
   IGST 18% = 7,801.20; gross 51,141.20; round off -0.20; invoice total 51,141.00.
   Eligible input credit: the Purchases ledger is marked eligible (CGST Act s.16(1); the accounting product marks a purchase ineligible with
   "Is ineligible for input credit?", help.tallysolutions.com/docs/te9rel66/Tax_India/gst/gst_accounting_for_ineligible_itc.htm, read 2026-11-26),
   so all of the IGST, 7,801.20, is eligible. It is the credit before the s.16(2) conditions (the bill in 2B, receipt, payment) are met. */
const PURCH_LINES = [['hdpe32',10,R(2050)],['bv50',100,R(228.4)]];

     <td class="num">${qty?qty:`<span style="color:var(--bad)">blank</span>`}</td><td class="num">${inr(rate)}</td><td class="num">${it?it.gst+'%':''}</td><td class="num">${amt?inr(amt):''}</td></tr>`}).join('');

  ${vsheetOpen(`<div class="fld span2"><label>Supplier</label><div class="ro">Nilgiri Steel Traders <span class="t2">· 29ZZZZZ0002Z1ZK ${badge('Check OK','b-ok','check')}</span></div></div>
    <div class="fld"><label>Supplier bill no.</label><div class="ro" data-first="1">NST/1150</div></div>
    <div class="fld"><label>Bill date</label><div class="ro">21 Nov 2026</div></div>
    <div class="fld"><label>Purchase ledger</label><div class="ro">Purchases</div></div>
    <div class="fld"><label>Place of supply</label><div class="ro">27 Maharashtra</div></div>
    <div class="fld"><label>Date ${kb('F2')}</label><div class="ro">21 Nov 2026</div></div>`)}
   <table class="lines"><thead><tr><th class="n">#</th><th>Item</th><th style="width:70px">HSN</th><th style="width:90px" class="num">Qty</th><th style="width:120px" class="num">Rate</th><th style="width:60px" class="num">GST</th><th style="width:140px" class="num">Amount</th></tr></thead><tbody>${rows}

     ${errs.length?errNote(errs):''}<div class="meta">Enter goes: supplier bill no. and date, supplier, purchase ledger, place of supply, then the lines. The voucher date is the screen's date (F2).</div></div>

/* credit note against SI/0412 (Shree Ganesh Traders, Maharashtra) and debit note against Rupa Polymers' bill RP/5398 (the sample's
   only purchase with item lines, PB/0125 of 15 Oct 2026: 58 HDPE pipe coils at 2,050.00 among others). Numbers are the sample's next:
   CN/0001 and DN/0001 (no note is posted in the sample; the engine counts from the highest number of the type).
   Credit note, CGST Act s.34(1): issued when goods are returned, or the taxable value or tax of an invoice is more than the actual
   (https://taxguru.in/goods-and-service-tax/credit-note-debit-note-section-34-rule-53-cgst-act-2017.html, read 2026-11-25). The same
   page gives Rule 53(1A): the note shows the serial number and date of the corresponding tax invoice. It says nothing about a buyer
   reversing input tax on a purchase return, so the debit note makes no such claim.
   Hand check, credit note: noz6 10 x 505.00 = 5,050.00; intra-state (supplier and place of supply 27), 18% split: CGST 454.50, SGST 454.50;
   total 5,959.00.
   Hand check, debit note: hdpe32 2 x 2,050.00 (the bill's rate) = 4,100.00; Rupa Polymers is in Gujarat (24), place of supply 27, so IGST
   18% = 738.00; total 4,838.00, round off 0.00.
   Validation (the app's refusal, crates/ledgerly-app/src/screens/item_invoice/draft.rs): a line whose item is chosen but whose quantity is
   blank is refused, "line 2: quantity: type a number", and the tax and total stay "Not computed". The engine has no rule that compares
   a returned quantity with the invoiced quantity, so the mock shows none: it only tells the user what the original invoice carried
   (SI/0412 of 14 Nov 2026 has 67 sets of the brass nozzle set; RP/5398 of 15 Oct 2026 has 58 coils of HDPE pipe, both read from the sample). */
const NOTE_SEED = {
 credit:{default:{lines:[['noz6',10,R(505)]],narr:'Returned 10 sets, damaged in transit'},'validation-error':{lines:[['noz6',10,R(505)],['lat16',null,null]],narr:''}},
 debit:{default:{lines:[['hdpe32',2,R(2050)]],narr:'Returned 2 coils, cracked in transit'},'validation-error':{lines:[['hdpe32',2,R(2050)],['bv50',null,null]],narr:''}}};
function noteScreen(kind){
 const cfg = kind==='credit'?{title:'Credit Note',no:'CN/0001',party:'sgt',bad:'Sales return',refLabel:'Against sales invoice',ref:'SI/0412',refDate:'14 Nov 2026',invoiced:'67 set of Brass nozzle set (6 pc)',hint:'Credit note, CGST Act s.34(1): reduces the tax on an invoice already issued'}
   : {title:'Debit Note',no:'DN/0001',party:'rupa',bad:'Purchase return',refLabel:'Against purchase bill',ref:'RP/5398',refDate:'15 Oct 2026',invoiced:'58 coil of HDPE pipe coil 32 mm',hint:'Debit note, purchase return: reduces what Godavari owes the supplier'};
 return {title:cfg.title,default:'default',
 render(st){
  const s = NOTE_SEED[kind][st]||NOTE_SEED[kind].default; const p=LED[cfg.party]; const bad = st==='validation-error';
  const ok = s.lines.filter(l=>l[1]);
  const inv = bad ? null : computeInvoice(ok.map(([item,qty,rate])=>({item,qty,rate})), p.st);
  const errs = bad ? ['Line 2: quantity: type a number.'] : [];
  const body = s.lines.map(([item,qty,rate],i)=>{const it=ITEM[item];
    return `<tr class="${i===(bad?1:0)?'active':''}"><td class="n">${i+1}</td><td>${esc(it.name)}</td><td class="t2">${it.hsn}</td><td class="num">${qty?qty:`<span style="color:var(--bad)">blank</span>`}</td><td class="num">${qty?inr(rate):''}</td><td class="num">${qty?it.gst+'%':''}</td><td class="num">${qty?inr(qty*rate):''}</td></tr>`}).join('');
  const taxLab = kind==='credit'?'CGST and SGST':'IGST 18%', taxAmt = inv?(kind==='credit'?inv.cgst+inv.sgst:inv.igst):0;
  const meta = kind==='credit'?'Enter goes: party, original invoice no. and date, sales ledger, place of supply, then the lines. The original invoice number and date are kept on the note (rule 53(1A), CGST Rules).'
    :'Enter goes: party, original bill no. and date, purchase ledger, place of supply, then the lines. Supplier in Gujarat (24), place of supply Maharashtra (27): IGST applies.';
  return `${phead([['Home',hashFor('home')],[cfg.title]],`${cfg.title} <span class="t2" style="font-weight:500">${cfg.no}</span>`,`${esc(cfg.hint)}`,
    `<button class="btn primary" data-cmd="save" ${bad?'disabled':''}>${ic('save')}Save ${kb('Ctrl+A')}</button>`)}
  ${vsheetOpen(`<div class="fld span2"><label>${kind==='credit'?'Party':'Supplier'}</label><div class="ro">${esc(p.name)} <span class="t2">· ${p.gstin} ${badge('Check OK','b-ok','check')}</span></div></div>
    <div class="fld"><label>Date ${kb('F2')}</label><div class="ro">21 Nov 2026</div></div>
    <div class="fld"><label>Place of supply</label><div class="ro">27 Maharashtra</div></div>
    <div class="fld"><label>${cfg.refLabel}</label><div class="ro">${cfg.ref}</div></div>
    <div class="fld"><label>Original invoice date</label><div class="ro">${cfg.refDate}</div></div>
    <div class="fld"><label>${kind==='credit'?'Sales ledger':'Purchase ledger'}</label><div class="ro">${kind==='credit'?'Sales':'Purchases'}</div></div>`)}
   <table class="lines"><thead><tr><th class="n">#</th><th>Item</th><th style="width:70px">HSN</th><th class="num" style="width:90px">Qty</th><th class="num" style="width:120px">Rate</th><th class="num" style="width:60px">GST</th><th class="num" style="width:140px">Amount</th></tr></thead><tbody>${body}</tbody></table>
   <div class="vfoot"><div class="stack"><div class="fld"><label>Narration</label><input value="${esc(s.narr)}"></div>
     ${errs.length?errNote(errs):''}<div class="meta">${meta}</div>
     <div class="meta">Invoiced on ${cfg.ref}, ${cfg.refDate}: ${cfg.invoiced} ${prov('eng','engine')}</div></div>
    <div><div class="taxbox"><div class="taxrow"><span class="lab">Taxable value</span><span class="num">${bad?'Not computed':inr(inv.taxable)}</span></div>
     ${kind==='credit'?`<div class="taxrow"><span class="lab">CGST 9%</span><span class="num">${bad?'Not computed':inr(inv.cgst)}</span></div><div class="taxrow"><span class="lab">SGST 9%</span><span class="num">${bad?'Not computed':inr(inv.sgst)}</span></div>`:`<div class="taxrow"><span class="lab">IGST 18%</span><span class="num">${bad?'Not computed':inr(inv.igst)}</span></div>`}
     <div class="taxrow tot"><span class="lab">Note total ${prov('eng','engine')}</span><span class="num">${bad?'Not computed':inr(inv.total)}</span></div></div></div></div>
  </div>`;
 },
 mount(){const i=$('.lines input');i&&i.focus()},
 key(k){if(k==='Ctrl+A'||k==='Ctrl+S'){toast(`${cfg.no} saved (mock).`,true);return true}return false},
 cmd(c){if(c==='save')toast('Saved (mock).',true)},
 back(){return hashFor('home')},
 keys(){return [['',cfg.title],['Enter','Next field'],['Alt+C','Create master'],['Ctrl+A','Save'],['Esc','Back']]}
 };
}

     <div class="taxrow tot"><span class="lab">Difference ${prov('eng','engine')}</span><span class="num" style="${diff?'color:var(--bad)':''}">${inr(diff)}</span></div></div></div></div>

 },

 cmd(c){if(c==='save')toast('Saved (mock).',true)},
 back(){return hashFor('home')},

/* reports. Hand check of the totals: Net profit equals the balance sheet's "Profit to date" (same ledgers,
   same stock value), so a mismatch would show on both screens. Trial balance Dr equals Cr because the
   ledgers sum to zero (the self-check at boot). Figures below are engine values at render time. */
/* Profit and loss in the horizontal form with the gross profit split: Trading (Opening Stock, Purchase Accounts,
   Direct Expenses, Gross Profit c/o on the left; Sales Accounts, Closing Stock on the right), then Indirect
   Expenses and Nett Profit on the left against Gross Profit b/f and Indirect Incomes on the right. Groups by
   default, the ledgers under each group in the detailed view (Alt+F1 here, as on the balance sheet).
   Source: https://help.tallysolutions.com/profit-and-loss-statement-tally/ (read 2026-11-25) documents the
   horizontal form, "Show with Gross Profit" (gross profit counts only the cost of sales and direct expenses,
   indirect expenses are then deducted to reach the nett profit) and a detailed view; the order of the groups
   inside each side is the owner's brief of 2026-11-25, the page does not spell it out. The look is ours.
   Hand check, 1 Apr to 21 Nov 2026 (every figure from the sample company's vouchers, not typed):
     Dr: Opening Stock 9,12,000.00 + Purchase Accounts 52,94,000.00 + Direct Expenses 1,84,000.00 = 63,90,000.00
     Cr: Sales Accounts 85,93,225.00 + Closing Stock 14,25,539.00 = 1,00,18,764.00
     Gross Profit = 1,00,18,764.00 - 63,90,000.00 = 36,28,764.00
     Indirect Expenses = Salaries 14,10,000 + Rent 2,00,000 + Electricity 1,11,260 + Bank charges 6,820
       + Depreciation 1,22,664 + Staff welfare 38,600 + Interest 61,250 + Round off 0.30 = 19,50,594.30
     Indirect Incomes (Discount received) 18,400.00
     Nett Profit = 36,28,764.00 - 19,50,594.30 + 18,400.00 = 16,96,569.70
   Closing stock by item (qty after November's sales x average cost): 187 x 3,120 + 573 x 395 + 96 x 1,080
     + 1,060 x 228.40 + 144 x 470 + 58 x 2,050 + 12 x 6,950 = 14,25,539.00. */
function plRows(opt){
  const short=opt&&opt.short; const b=balances(short?SHORT_VOUCHERS:[]); const st=stockPosition(short);
  const grp=(name,gid,sign)=>{const children=LEDGERS.filter(l=>l.group===gid&&b[l.id]!==0).map(l=>({name:l.name,amt:sign*b[l.id]}));
    return {name,amt:children.reduce((s,c)=>s+c.amt,0),children}};
  const open=grp('Opening stock','openstock',1), purch=grp('Purchase Accounts','purchacc',1), dexp=grp('Direct Expenses','direxp',1);
  const sales=grp('Sales Accounts','salesacc',-1), close={name:'Closing stock',amt:st.value,children:[],provisional:st.provisional};
  const gp=sales.amt+close.amt-(open.amt+purch.amt+dexp.amt);
  const iexp=grp('Indirect Expenses','indexp',1), iinc=grp('Indirect Incomes','indinc',-1);
  const net=gp+iinc.amt-iexp.amt;
  return {open,purch,dexp,sales,close,gp,iexp,iinc,net,stock:st,provisional:st.provisional};
}

/* trial balance. Rows are the sample company's ledgers with a balance (crates/ledgerly-sample/assets/godavari.toml),
   one per ledger, with the group names the engine uses ("Capital Account", "Duties & Taxes", ...). The sample has one
   ledger per tax head (CGST, SGST, IGST), so the mock's separate output and input ledgers are netted into three rows.
   Hand check, as at 20 Nov 2026 (no voucher is dated after 20 Nov):
     CGST: output 15,323.65 (sales) less input 0 on the mock's intra-state purchases = 15,323.65 Cr; SGST the same;
     IGST: output 20,370.00 Cr less input 29,520.00 Dr = 9,150.00 Dr (the tax on the purchases is more than on the sales).
     Debit total 1,25,33,742.30 = credit total 1,25,33,742.30 (the old total, 1,25,54,112.30, counted IGST gross on both sides). */
const TB_GROUP = {capital:'Capital Account',secured:'Secured Loans',creditors:'Sundry Creditors',duties:'Duties & Taxes',provisions:'Provisions',
  fixed:'Fixed Assets',debtors:'Sundry Debtors',cash:'Cash-in-Hand',bank:'Bank Accounts',advances:'Loans & Advances (Asset)',salesacc:'Sales Accounts',
  purchacc:'Purchase Accounts',direxp:'Direct Expenses',indexp:'Indirect Expenses',indinc:'Indirect Incomes',openstock:'Stock-in-Hand'};
/* The trial balance lists the groups in the chart of accounts' order, each group's ledgers under it in the order they were
   created: the primary groups alphabetically (Capital Account, Current Assets, Current Liabilities, Direct Expenses, Fixed
   Assets, Indirect Expenses, Indirect Incomes, Loans (Liability), Purchase Accounts, Sales Accounts) with the sub-groups of
   Current Assets, Current Liabilities and Loans (Liability) directly under their primary group. This is the order the
   engine's detailed trial balance gives. */
const TB_ORDER = ['Capital Account','Bank Accounts','Cash-in-Hand','Loans & Advances (Asset)','Stock-in-Hand','Sundry Debtors','Duties & Taxes','Provisions','Sundry Creditors','Direct Expenses','Fixed Assets','Indirect Expenses','Indirect Incomes','Secured Loans','Purchase Accounts','Sales Accounts'];
const TB_TAX = [['CGST',['cgstout','cgstin']],['SGST',['sgstout','sgstin']],['IGST',['igstout','igstin']]];
function tbRows(){
  const b=balances(); const tax=new Set(TB_TAX.flatMap(t=>t[1])); const out=[];
  for(const l of LEDGERS){
    const t=TB_TAX.find(x=>x[1][0]===l.id);
    if(t){const v=b[t[1][0]]+b[t[1][1]];if(v!==0)out.push([t[0],TB_GROUP.duties,v]);continue}
    if(tax.has(l.id)||b[l.id]===0)continue;
    out.push([l.name,TB_GROUP[l.group],b[l.id]]);}
  return out.map((r,i)=>[r,i]).sort((a,b)=>TB_ORDER.indexOf(a[0][1])-TB_ORDER.indexOf(b[0][1])||a[1]-b[1]).map(([[n,g,v]])=>[n,g,v>0?v:0,v<0?-v:0]); }

   <div class="card"><table class="t" id="tb"><thead><tr><th>Ledger</th><th>Group</th><th class="num" style="width:170px">Debit</th><th class="num" style="width:170px">Credit</th></tr></thead><tbody>

/* audit: the audit trail, read-only, in the shape the engine's reports give (crates/ledgerly-reports/src/audit.rs).
   Edit log: one line per audit event of the period with Seq, Date, Time, User, Action, Object, Reason, Field, Before, After;
   the notes count events per user. In the sample company every voucher is a "Posted voucher" event (no alteration, so the
   Reason, Field, Before and After cells are empty), stamped at noon (+05:30) on the voucher's own date and entered by user 1
   (Ananya K.) or user 2 (Rohan D.); an accepted AI draft shows as the assistant acting for that user. The engine labels users
   "user N", not by name. Period 1 to 20 Nov 2026: the engine's other events (the masters, the number series, the lock, the bank
   statement) are stamped 21 Nov, the day the company file was made, so they are outside it.
   Seq: observed in the app's audit capture of 2026-11-25 (branch s12/reports-to-mock): the first sample voucher, RC/0208, is event 109;
   the sample's vouchers are posted one event each in the order of godavari.toml, and the voucher id is that position (SI/0401 is the
   27th, so voucher 27, event 135). Counts, hand check: 14 November vouchers = user 1 (SI/0401, SI/0412, SI/0417, RC/0219, PY/0318,
   JV/0032) 6 + user 2 (SI/0405, RC/0215, PY/0316, CT/0021, SI/0415, PB/0144) 6 + assistant for user 1 (PY/0315, PB/0141) 2.
   Edits after lock: the engine lists a voucher event that touches a date on or before the lock date in force WHEN the event was
   recorded. The sample's books were locked (31 Oct) after every voucher was posted, so the list is empty: 0 events. */
const AUDIT_ASSISTANT = new Set(['PY/0315','PB/0141']);
const AUDIT_FIRST_SEQ = 135; // SI/0401, the 27th voucher of the sample, event 109 - 1 + 27
function auditEvents(){
  return VOUCHERS.map((v,i)=>{const u=v.by==='Ananya K.'?1:2; const ai=AUDIT_ASSISTANT.has(v.id);
    const [dd,mm,yy]=v.date.split('-');
    return {seq:AUDIT_FIRST_SEQ+i,date:v.date,user:ai?`assistant assistant for user ${u}`:`user ${u}`,
      object:`${v.type} ${v.id} dated ${yy}-${mm}-${dd} [voucher ${27+i}]`}}); }
const AUDIT_COLS=['Seq','Date','Time','User','Action','Object','Reason'];
function auditCounts(ev){const m={};for(const e of ev)m[e.user]=(m[e.user]||0)+1;return Object.keys(m).sort().map(k=>`${k}: ${m[k]} event${m[k]===1?'':'s'}`)}
