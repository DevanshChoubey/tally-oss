     <div class="fld"><label>Port</label><input class="num" value="${f.port}" ${dis}></div>
     <div class="fld"><label>Company in the other app</label><input value="${esc(f.company)}" placeholder="its exact name" ${dis}></div></div>
    <div class="actions" style="margin-top:12px"><button class="btn primary" ${noCo||running?'disabled':''}>${ic('upload')}Import the company ${kb('Enter')}</button></div>${note}</div>`;
  const detect = `<div class="card pad" style="margin-top:12px"><h2>Step by step, with a report</h2><p class="meta">Ledgerly looks for a running app on this computer, port 9000, or reads an XML file exported from your previous accounting app. Nothing is sent anywhere else.</p>
    <div class="actions" style="margin-top:10px"><button class="btn" disabled>Look for a running app</button></div>
    <div class="fld" style="margin-top:12px"><label>Exported XML file</label><input placeholder="path of the exported file" disabled></div>
    <div class="actions" style="margin-top:8px"><button class="btn" disabled>Read exported file</button></div>
    ${impNote('info','Not available yet: the step-by-step import and its reconciliation report are not connected to the app. Use the one-step import above.')}</div>`;
  const steps=`<ol style="display:flex;flex-wrap:wrap;gap:18px;list-style:none;padding:0;margin:0 0 14px" aria-label="Import steps">${IMP_STEPS.map((l,n)=>`<li class="${n===0?'':'t2'}" ${n===0?'aria-current="step"':''}><b>${n+1}</b> ${l}</li>`).join('')}</ol>`;
  return phead([['Home',hashFor('home')],['Import from another app']],'Import from another app','Bring your masters and vouchers in from another accounting app. Everything is read on this computer, and a report shows what moved.')
   + steps + noCoBlock + direct + detect;
 },
 key(k){return false},
 back(){return hashFor('setup','welcome')},
 keys(st){return st==='running'?[['','Importing'],['Esc','Back']]:[['','Import from another app'],['Enter','Import the company'],['Esc','Back']]}
};

/* the tab strip (shell/chrome.rs): the open tabs, the active one underlined, New tab and Close tab at the right.
   Titles follow unique_tab_labels: the second tab of the same screen is "<title> 2". */
function tabStripFor(p){
 if(p.tabs!=='2') return '';
 const title=(SCREENS[p.screen]||{}).title||'Home';
 const tab=(label,sel)=>`<button role="tab" aria-selected="${sel}" style="padding:8px 14px;border:0;background:none;font:inherit;color:${sel?'var(--text)':'var(--text-2)'};border-bottom:2px solid ${sel?'var(--accent)':'transparent'};cursor:pointer">${esc(label)}</button>`;
 return `<div class="tabstrip" role="tablist" style="display:flex;align-items:center;gap:4px;border-bottom:var(--bw) solid var(--border);margin-bottom:12px">${tab(title,false)}${tab(title+' 2',true)}<span style="margin-left:auto;display:flex;gap:6px"><button class="btn" aria-label="Close tab">${ic('x')}Close tab ${kb('Ctrl+W')}</button><button class="btn" aria-label="New tab">${ic('plus')}New tab ${kb('Ctrl+T')}</button></span></div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
/* a document-read value becomes the user's once touched: drop the dashed AI style */
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('aifield')){t.classList.remove('aifield');t.classList.remove('blank');t.dataset.touched='1'}});
(function boot(){
  const fails=selfCheck(); const bs=balanceSheet();
  if(fails.length)console.error('Ledgerly mock engine self-check FAILED',fails);
  else console.info(`Ledgerly mock engine self-check passed: vouchers balance, trial balance is zero, balance sheet sides agree at ₹${inr(bs.L)}, 3B outward tax equals voucher tax, GSTR-1 taxable equals 3B, statement adds up.`);
  window.__ledgerly={selfCheck,states:REG.states.length,transitions:REG.transitions.length};
  if(!location.hash||location.hash==='#')history.replaceState(null,'','#screen=home&state=default');
  render();
})();
</script>
