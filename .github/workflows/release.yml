name: release

# Builds the release artifacts when a version tag is pushed (v0.1.0 and so on). Each platform job
# builds from the tag with the same flags as scripts/repro-check.sh (remapped paths, the commit
# time as SOURCE_DATE_EPOCH), packages its files, and uploads them. The publish job writes
# SHA256SUMS.txt over every artifact and attaches everything to the GitHub release.
#
# Actions used: actions/checkout, dtolnay/rust-toolchain (no build cache, so a cache cannot reach
# a release),
# actions/upload-artifact and actions/download-artifact (GitHub's own), and
# actions/attest-build-provenance (signed SLSA provenance for every release artifact, checked
# with `gh attestation verify`), and signpath/github-action-submit-signing-request (Authenticode
# signing of the Windows installer, only when the SignPath secrets are set; docs/signing.md).
# Every action is pinned to a full commit SHA. Everything else is
# a shell command on the runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100
      - name: Set reproducible build flags
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/ledgerly --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE/target=/target" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: cargo build --release --locked -p ledgerly-app -p ledgerly-cli
      - name: Package tar.gz and deb
        run: bash packaging/linux/package.sh "${GITHUB_REF_NAME}" target/release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      # The signing service fetches the unsigned installer artifact with this job's token.
      actions: read
    env:
      # Empty when the secrets are not set (forks, and until the SignPath Foundation accepts the
      # project): the signing steps are then skipped and the installer ships unsigned, as before.
      # docs/signing.md says how to get them.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100
      - name: Set reproducible build flags
        shell: pwsh
        run: |
          $epoch = git log -1 --format=%ct
          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_DATE_EPOCH=$epoch"
          $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $cargo = "$HOME/.cargo" -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=--remap-path-prefix=$ws=/ledgerly --remap-path-prefix=$cargo=/cargo -C link-arg=/Brepro"
      - name: Build release binaries
        run: cargo build --release --locked -p ledgerly-app -p ledgerly-cli
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package zip and installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          $env:PATH = "$iscc;$env:PATH"
          ./packaging/windows/package.ps1 -Version $env:GITHUB_REF_NAME -ReleaseDir target\release -OutDir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-unsigned
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ledgerly
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Replace the installer with the signed one
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          # Only the signed installer goes on to SHA256SUMS.txt, the attestation and the
          # winget and Chocolatey manifests. A signature that does not verify stops the release.
          $signed = Get-ChildItem dist-signed -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no installer' }
          $sig = Get-AuthenticodeSignature $signed.FullName
          if ($sig.Status -ne 'Valid') { throw "The signed installer does not verify: $($sig.Status)" }
          Remove-Item dist\*-setup.exe
          Copy-Item $signed.FullName dist\
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100
      - name: Set reproducible build flags
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/ledgerly --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE/target=/target" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: cargo build --release --locked -p ledgerly-app -p ledgerly-cli
      - name: Install librsvg for the icon
        run: brew install librsvg
      - name: Package .app in a .dmg
        run: bash packaging/macos/package.sh "${GITHUB_REF_NAME}" target/release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded
      - name: Gather the release files
        # Each artifact is in its own folder. Only these four are released: the unsigned installer
        # sent to SignPath (windows-installer-unsigned) has the same file name as the signed one,
        # so it must never be merged in.
        run: |
          mkdir artifacts
          cp downloaded/linux/* downloaded/windows/* downloaded/windows-installer/* downloaded/macos/* artifacts/
          ls -l artifacts
      - name: Write SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Fill the winget and Chocolatey manifests
        # From the installer released above and its line in SHA256SUMS.txt; no hash is typed.
        run: scripts/fill-package-manifests.sh "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt package-manifests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-manifests
          path: package-manifests
          if-no-files-found: error
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Ledgerly $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --verify-tag
